services:
  postgres:
    image: postgres:16-alpine
    container_name: titrate_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: titrate_admin
      POSTGRES_PASSWORD: titrate_local_dev_password
      POSTGRES_DB: titrate_health_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: titrate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: